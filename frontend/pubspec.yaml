name: video_edit_app
description: "移动端短视频智能剪辑APP"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.4.3+1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  image_picker: ^1.0.7
  video_player: ^2.8.6
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  file_picker: ^8.0.3
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.19.0
  photo_manager: ^3.2.2
  fl_chart: ^0.69.0
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
