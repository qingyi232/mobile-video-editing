server:
  port: 8080

spring:
  application:
    name: video-edit-backend

  datasource:
    url: jdbc:mysql://localhost:3306/video_edit?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

app:
  jwt:
    secret: VideoEditAppSecretKeyForJWTTokenGeneration2026
    expiration-ms: 86400000

  upload:
    video-dir: ./uploads/videos
    music-dir: ./uploads/music
    avatar-dir: ./uploads/avatars
    export-dir: ./uploads/exports
    template-dir: ./uploads/templates

  ffmpeg:
    path: ffmpeg

  baidu-asr:
    app-id: "7609532"
    api-key: SVH55P9lfoSJXtJ5bsMnASWf
    secret-key: 9TKOkcHg3Ub0gwFRfpouGF0qqiZiHw6i
